; 이 파일을 복사해서 config.ini 로 이름을 바꾼 뒤 값을 채우세요.
; config.ini 에는 비밀번호가 들어가므로 다른 사람에게 보내거나 카톡/Slack에 올리지 마세요.

[bak]
base_url = http://bak-erp.com
; 로그인 화면의 [대표아이디] [아이디] [비밀번호] 세 칸
company_id =
; 보안관 '조회 전용' 아이디
user_id =
; 비밀번호는 여기에 쓰지 말고 '비밀번호_변경.bat' 으로 저장하세요 (윈도우 자격 증명에 암호화 저장).
; 예전처럼 여기에 적어도 동작은 하지만, 파일을 열면 누구나 볼 수 있습니다.
password =
; 보통은 비워두세요. 로그인 화면을 못 찾는다는 오류가 날 때만 로그인 페이지 주소를 적습니다.
login_url =

[slack]
; Slack Incoming Webhook 주소 (https://hooks.slack.com/services/... 형태)
webhook_url =

[watch]
; 보안관 확인 간격(초). 120 = 2분. 최소 60
interval_sec = 120
; 이 시간 사이에만 확인합니다
work_start = 07:30
work_end = 20:00

[empty]
; 빈 구간 안내를 보낼 시각 (쉼표로 여러 개)
send_times = 08:00,13:00
; 오늘부터 며칠치를 보낼지
days = 3
; 구간당 몇 건까지 배정 가능한지 (1이면 '아무도 없는 구간'만 빈 구간으로 안내)
slot_capacity = 1
; 일요일 제외 (yes/no)
skip_sunday = yes
; 빈 구간 안내 모양: table(표) / text(글)
format = table

[image]
; 변경이 생기면 보안관 일정표를 그림(캡처)으로 Slack에 올립니다 (yes/no)
enabled = yes
; Slack 봇 토큰 (xoxb- 로 시작) — 설치안내.txt 의 '그림 알림 설정' 참고
bot_token =
; 그림을 올릴 채널 ID (C 로 시작) — 채널 이름 클릭 → 맨 아래 '채널 ID'
channel_id =
; 그림 모양: table = 휴대폰용 표 (기본) / capture = 보안관 화면 캡처
style = table
; 그림에 담을 날짜 수 (오늘부터)
days = 3
; 새 그림을 올리면 이전 그림은 지움 (yes/no)
delete_previous = yes

[admin]
; ── 본사(마지) 원격 관리용. 우리 대리점만 쓸 때는 비워둬도 됩니다 ──
; 관리 채널에 표시될 대리점 이름 (예: 린나이영등포)
site_name =
; 본사 관리 채널 Webhook 주소 — 매일 아침 '정상 작동', 오류·복구·업데이트를 보고 (고객정보는 보내지 않음)
admin_webhook_url =
; 업데이트 확인 주소. 6시간마다 확인해서 바뀐 파일만 자동 교체 후 재시작
;   우리 마지 PC = 시험판 주소(…/release/beta/manifest.json)
;   다른 업체 PC = 전체 주소(…/release/stable/manifest.json)   ← 노트북 관리폴더의 업데이트주소.txt 참고
update_url =
; 자동 업데이트 사용 (yes/no)
auto_update = yes
; 매일 '정상 작동' 보고 시각
heartbeat_time = 08:05
